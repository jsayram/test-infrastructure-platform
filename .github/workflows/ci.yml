name: CI

on: push

permissions:
  contents: read

jobs:
  app:
    name: App lint, unit tests, image builds and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker
          cache-binary: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1
          cache-binary: false
      - run: npx --no-install playwright install --with-deps chromium
      - name: Build, smoke test, and run browser journeys
        env:
          COMPOSE_PROJECT_NAME: tip-ci
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --wait --wait-timeout 150
          npm run smoke -- --restart-api
          npm run test:e2e
      - name: Summarize browser results
        if: ${{ !cancelled() && hashFiles('test-results/playwright.json') != '' }}
        run: npm run test:e2e:report -- test-results/playwright.json test-results/history.json test-results/dashboard.md
      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() && hashFiles('test-results/playwright.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  terraform:
    name: Terraform formatting, validation and mocked plan tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
