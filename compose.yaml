services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable local database password}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "demo", "-d", "test_platform"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    image: tip-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DB_HOST: db
      DB_USER: demo
      DB_NAME: test_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable local database password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    image: tip-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
